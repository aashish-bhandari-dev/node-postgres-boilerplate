name: Run Tests

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master, develop]
  # pull_request:
  #   branches: [main, master, develop]

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/node_boilerplate_test?schema=public
  JWT_ACCESS_SECRET: ci_jwt_access_secret_mock_key_12345
  JWT_REFRESH_SECRET: ci_jwt_refresh_secret_mock_key_67890

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run unit tests (Vitest)
        run: npm test
